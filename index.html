<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<title>Grimório · Magias de D&D 5e</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="description" content="Grimório de magias de D&D 5e — prepare, marque como favorita, filtre por classe / nível / escola e imprima a lista de magias do seu personagem. PT-BR e EN, edições 2014 e 2024."/>
<meta name="theme-color" content="#f8f7f3"/>
<meta name="color-scheme" content="light"/>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"/>

<!-- Favicon: SVG transparente (fita de preparada + estrela de favorita) -->
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>

<!-- PWA: instalável e 100% offline (service worker pré-cacheia shell + magias) -->
<link rel="manifest" href="manifest.json"/>

<!-- Open Graph / share-build previews -->
<meta property="og:type" content="website"/>
<meta property="og:title" content="Grimório · Magias de D&D 5e"/>
<meta property="og:description" content="Prepare, favorite e imprima as magias do seu personagem de D&D 5e."/>
<meta property="og:locale" content="pt_BR"/>

<!-- Fontes (Texturina display + JetBrains Mono) agora são self-hosted nos
     @font-face de hifi-tokens.css → fonts/*.woff2. Sem <link> pro Google Fonts:
     evita render-blocking, vazamento de IP pro Google e funciona offline. -->
<!-- V11 design tokens (Catppuccin / Nord / Monokai / Solarized) + @font-face (Marauder, Texturina, JetBrains Mono) -->
<link rel="stylesheet" href="hifi-tokens.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f8f7f3; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  #root { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
  /* Fundo do body segue o --base do tema ativo (claro ou escuro), pra não
     deixar faixa de cor errada no overscroll / safe-area. #f8f7f3 é só o
     fallback antes do React montar e aplicar a classe do tema. */
  body.hifi { background: var(--base, #f8f7f3); }

  /* Boot / loading state — shown until React mounts (and while the first
     spell JSON is fetched). Uses the mono face so it matches the chrome. */
  .od-boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace; color: #5a5747;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    background: #f8f7f3;
  }
  .od-boot__mark {
    font-family: 'Texturina', Georgia, serif; font-weight: 700;
    font-variant: small-caps; letter-spacing: 0.06em;
    font-size: 26px; color: #272822; text-transform: none;
  }
  .od-boot__dots { display: inline-flex; gap: 5px; }
  .od-boot__dots i {
    width: 6px; height: 6px; border-radius: 50%; background: #c5bca6;
    animation: od-pulse 1s ease-in-out infinite;
  }
  .od-boot__dots i:nth-child(2) { animation-delay: 0.15s; }
  .od-boot__dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes od-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; background: #8e63d6; } }
  @media (prefers-reduced-motion: reduce) { .od-boot__dots i { animation: none; } }

  /* Fallback shown only if React/Babel fail to load (e.g. offline CDN). */
  .od-fallback { max-width: 360px; text-align: center; line-height: 1.6; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<div id="root">
  <div class="od-boot">
    <div class="od-boot__mark">Grimório</div>
    <div class="od-boot__dots"><i></i><i></i><i></i></div>
    <noscript><div class="od-fallback">Este grimório precisa de JavaScript ativado.</div></noscript>
  </div>
</div>

<script>
// Plano B do boot: se o app não montou em 12s (CDN fora, erro de transpile…),
// troca os pontinhos por uma mensagem acionável em vez de girar pra sempre.
// Script simples de propósito — precisa funcionar mesmo se React/Babel falharem.
setTimeout(function () {
  var boot = document.querySelector('#root .od-boot');
  if (!boot) return; // React montou e substituiu o conteúdo — tudo certo.
  var dots = boot.querySelector('.od-boot__dots');
  if (dots) dots.remove();
  var msg = document.createElement('div');
  msg.className = 'od-fallback';
  msg.innerHTML = 'O grimório está demorando mais que o normal.<br/>' +
    'Verifique a conexão e <a href="javascript:location.reload()" style="color:inherit">recarregue a página</a>.<br/>' +
    '<span style="opacity:.7">Taking too long? Check your connection and reload.</span>';
  boot.appendChild(msg);
}, 12000);

// PWA: registra o service worker (offline + instalável). file:// não suporta.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>

<!-- React + Babel standalone (pinned). Babel transpiles the JSX modules below
     in the browser, so this same folder works locally (file://), in the preview,
     and on GitHub Pages with no build step. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- DOMPurify: a tranca de sanitização do PKG-05. Sem este script, sanitizePack falha fechada e nada é gravado — não há caminho de import que grave HTML sem sanitizar. -->
<script src="https://unpkg.com/dompurify@3.4.13/dist/purify.min.js" integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t" crossorigin="anonymous"></script>

<!-- Production dependency set for the V11 (hi-fi) product.
     ORDER MATTERS: helpers define spellName / schoolKey / v8Description that the
     components call by bare reference; the loader overrides v7BuildSpells with
     real JSON data; the plugin store (see below) exposes window.pluginStore and
     must exist before any component that queries it; the editor + hi-fi shell
     consume both. -->
<!-- plugin-store.jsx loads BEFORE spells-data-loader.jsx: the loader calls
     refreshPluginVersions() during boot, and that call enumerates nothing (and
     warns nothing) when window.pluginStore is still undefined. Babel standalone
     executes text/babel scripts in document order at DOMContentLoaded, so the
     loader's boot branch runs before any later script -- an installed pack would
     silently vanish from the selector on reload.
     pack-import.jsx needs window.pluginStore and the DOMPurify script above, so
     it loads right after the plugin store script; pack-rename-dialog.jsx (Fase
     8) uses window.useDialogA11y and the peek*() accessors from the v11
     editor, so it loads right after it, and exposes window.PackRenameDialog
     for PackManagerRoot in pack-manager.jsx (the import dialog does not use
     it: import auto-renames and only shows a notice).
     The transition-banner module (06-04) consumes window.__openPackManager
     (exposed above) and window.peekBookmarks (exposed by the v11 editor), so it
     loads right after the pack manager script and before the hi-fi shell. -->
<script type="text/babel" src="grimorio-helpers.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="plugin-store.jsx"></script>
<script type="text/babel" src="spells-data-loader.jsx"></script>
<script type="text/babel" src="pack-import.jsx"></script>
<script type="text/babel" src="v11-character-editor.jsx"></script>
<script type="text/babel" src="pack-rename-dialog.jsx"></script>
<script type="text/babel" src="pack-import-dialog.jsx"></script>
<script type="text/babel" src="pack-manager.jsx"></script>
<script type="text/babel" src="transition-banner.jsx"></script>
<script type="text/babel" src="v10-hifi.jsx"></script>

<script type="text/babel">
// ── UI prefs persistence (dark mode + active character survive a refresh) ──
const UI_PREFS_KEY = 'spellbook-ui-prefs';
const ONBOARDING_SEEN_KEY = 'spellbook-onboarding-v1';
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(UI_PREFS_KEY)) || {}; } catch (e) { return {}; }
}
function savePrefs(p) {
  try { localStorage.setItem(UI_PREFS_KEY, JSON.stringify(p)); } catch (e) {}
}
function hasSeenOnboarding() {
  try { return localStorage.getItem(ONBOARDING_SEEN_KEY) === '1'; } catch (e) { return false; }
}
function markOnboardingSeen() {
  try { localStorage.setItem(ONBOARDING_SEEN_KEY, '1'); } catch (e) {}
}

// Idioma da UI é estado próprio (uiLang em App), independente da versão de
// magias ativa. Na primeira visita (sem `prefs.lang` salvo) detectamos pelo
// idioma do navegador.
function browserLanguageCandidates() {
  try {
    return [
      ...Array.from(navigator.languages || []),
      navigator.language,
      navigator.userLanguage,
      navigator.browserLanguage,
    ].filter(Boolean).map(l => String(l).toLowerCase());
  } catch (e) { return []; }
}
function detectLang() {
  const candidates = browserLanguageCandidates();
  return candidates.some(l => l.startsWith('pt')) ? 'ptbr' : 'en';
}
function decodeSharedBuildPayload(payload) {
  // searchParams converte '+' em espaço; base64 nunca tem espaço, então
  // restaurar é seguro — cobre links antigos gerados sem encodeURIComponent.
  const binary = atob(String(payload).replace(/ /g, '+'));
  const encoded = Array.from(binary, ch =>
    '%' + ch.charCodeAt(0).toString(16).padStart(2, '0')
  ).join('');
  return JSON.parse(decodeURIComponent(encoded));
}

function decodeSharedBuildFromUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) throw new Error('empty');
  let payload = raw;
  try {
    const url = new URL(raw, window.location.href);
    payload = url.searchParams.get('build') || raw;
  } catch (e) {}
  return decodeSharedBuildPayload(payload);
}

function uniqueImportedCharacterName(baseName, chars, lang) {
  const fallback = lang === 'ptbr' ? 'Personagem importado' : 'Imported character';
  const base = String(baseName || fallback).trim() || fallback;
  const used = new Set((chars || []).map(c => String(c.name || '').toLowerCase()));
  if (!used.has(base.toLowerCase())) return base;
  const suffix = lang === 'ptbr' ? 'importado' : 'imported';
  let i = 2;
  let candidate = `${base} (${suffix})`;
  while (used.has(candidate.toLowerCase())) {
    candidate = `${base} (${suffix} ${i})`;
    i += 1;
  }
  return candidate;
}

function importSharedBuildUrl(value, lang) {
  const build = decodeSharedBuildFromUrl(value);
  const chars = typeof loadCharacters === 'function' ? loadCharacters() : [];
  const character = {
    id: `char-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,
    name: uniqueImportedCharacterName(build.name, chars, lang),
    accentId: build.accentId || 'blue',
    prepared: Array.isArray(build.prepared) ? build.prepared : [],
    bookmarked: [],
    slots: build.slots || { total: {}, used: {} },
    classes: Array.isArray(build.classes) ? build.classes : [],
  };
  if (typeof persistCharacters === 'function') persistCharacters([...chars, character]);
  if (Array.isArray(build.bookmarked) && typeof persistBookmarks === 'function') {
    persistBookmarks([...new Set([...(typeof loadBookmarks === 'function' ? loadBookmarks() : []), ...build.bookmarked])]);
  }
  return character;
}

// Track viewport so we can swap desktop ⇆ mobile layout responsively.
// This is what makes one HTML file work on desktop web, iOS and Android.
function useViewport() {
  const [size, setSize] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => {
    let raf = 0;
    const onResize = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setSize({ w: window.innerWidth, h: window.innerHeight }));
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
      cancelAnimationFrame(raf);
    };
  }, []);
  return size;
}

function OnboardingModal({ lang, dark, theme, onCreate, onContinue, onImported }) {
  const T = (pt, en) => lang === 'ptbr' ? pt : en;
  const [mode, setOnboardingMode] = React.useState('choice');
  const [url, setUrl] = React.useState(() => {
    try { return new URL(window.location.href).searchParams.has('build') ? window.location.href : ''; }
    catch (e) { return ''; }
  });
  const [error, setError] = React.useState('');
  const dialogRef = React.useRef(null);
  const themeClass = `${dark ? 'hifi-dark' : 'hifi-light'}${theme && theme !== 'catppuccin' ? ' hifi-theme-' + theme : ''}`;
  window.useDialogA11y?.(dialogRef, true, () => {});

  function submitImport() {
    try {
      const character = importSharedBuildUrl(url, lang);
      markOnboardingSeen();
      onImported(character);
    } catch (e) {
      setError(T('Não consegui ler essa URL de build. Confira o link e tente de novo.', 'Could not read that build URL. Check the link and try again.'));
    }
  }

  return (
    <div
      className={`hifi ${themeClass}`}
      style={{
        position: 'fixed', inset: 0, zIndex: 100,
        background: 'rgba(0,0,0,0.55)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 18,
      }}
    >
      <section
        ref={dialogRef}
        role="dialog"
        aria-modal="true"
        aria-label={T('Comece pelo seu personagem', 'Start with your character')}
        tabIndex={-1}
        style={{
          width: 'min(680px, 100%)',
          minHeight: 320,
          maxHeight: 'min(720px, calc(100vh - 36px))',
          overflow: 'hidden',
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fit, minmax(min(280px, 100%), 1fr))',
          background: 'var(--base)',
          color: 'var(--text)',
          border: '1px solid var(--surface1)',
          borderRadius: 8,
          boxShadow: '0 24px 80px rgba(0,0,0,0.45)',
        }}
      >
        <div style={{
          padding: 26,
          background: 'var(--mantle)',
          borderRight: '1px solid var(--surface1)',
          display: 'flex',
          flexDirection: 'column',
          justifyContent: 'flex-start',
          gap: 12,
        }}>
          <div className="hifi-section-label">{T('primeira visita', 'first visit')}</div>
          <h2 className="hifi-display" style={{ fontSize: 26, lineHeight: 1.12, margin: 0 }}>
            {T('Comece pelo seu personagem', 'Start with your character')}
          </h2>
          <p style={{ margin: 0, color: 'var(--subtext0)', fontSize: 14, lineHeight: 1.55 }}>
            {T(
              'Crie ou importe um personagem para salvar magias preparadas, favoritas e aparência neste aparelho.',
              'Create or import a character to save prepared spells, bookmarks, and appearance on this device.'
            )}
          </p>
        </div>

        <div style={{ padding: 22, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 10, overflow: 'auto' }}>
          <div key={mode} className="hifi-onboarding-actions" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {mode === 'choice' ? (
              <>
              <button
                className="hifi-btn-primary"
                onClick={() => { markOnboardingSeen(); onCreate(); }}
                style={{ minHeight: 38, justifyContent: 'center' }}
              >
                {T('Criar novo personagem', 'Create new character')}
              </button>
              <button
                className="hifi-btn-secondary"
                onClick={() => { setError(''); setOnboardingMode('import'); }}
                style={{ minHeight: 38, justifyContent: 'center' }}
              >
                {T('Carregar personagem por URL', 'Load character from URL')}
              </button>
              <button
                className="hifi-btn-ghost"
                onClick={() => { markOnboardingSeen(); onContinue(); }}
                style={{ minHeight: 38, justifyContent: 'center', color: 'var(--subtext0)' }}
              >
                {T('Continuar como aventureiro anônimo', 'Continue as anonymous adventurer')}
              </button>
              </>
            ) : (
              <>
              <label className="hifi-section-label" htmlFor="onboarding-build-url">
                {T('url da build', 'build url')}
              </label>
              <textarea
                id="onboarding-build-url"
                className="hifi-input"
                value={url}
                onChange={(e) => { setUrl(e.target.value); setError(''); }}
                placeholder={T('Cole a URL da sua build aqui', 'Paste your build URL here')}
                rows={4}
                style={{ height: 'auto', minHeight: 92, resize: 'vertical', padding: 10, borderRadius: 6 }}
              />
              <p style={{ margin: '2px 0 8px', color: 'var(--subtext0)', fontSize: 12, lineHeight: 1.45 }}>
                {T(
                  'Ela será copiada para este aparelho; mudanças futuras não serão sincronizadas com o link original.',
                  'It will be copied to this device; future changes will not sync with the original link.'
                )}
              </p>
              {error && <div style={{ color: 'var(--red)', fontSize: 12, lineHeight: 1.4 }}>{error}</div>}
              <button className="hifi-btn-primary" onClick={submitImport} style={{ minHeight: 38, justifyContent: 'center' }}>
                {T('Importar neste aparelho', 'Import on this device')}
              </button>
              <button className="hifi-btn-ghost" onClick={() => setOnboardingMode('choice')} style={{ justifyContent: 'center' }}>
                {T('Voltar', 'Back')}
              </button>
              </>
            )}
          </div>
        </div>
      </section>
    </div>
  );
}

function App() {
  const initial = React.useRef(loadPrefs()).current;
  // Design system canônico: tema "Claro (carta)" = 'daylight'. Só o modo
  // claro/escuro alterna (toggle da vela); o modo é persistido. Na primeira
  // visita (sem preferência salva) segue o modo do sistema operacional.
  const [dark, setDark] = React.useState(
    initial.dark ?? (window.matchMedia?.('(prefers-color-scheme: dark)')?.matches || false)
  );
  const [theme, setTheme] = React.useState('daylight');
  const [charName, setCharName] = React.useState(initial.characterName || null);
  // A seleção de pacotes de magias (Fase 8) não vive mais aqui: o loader
  // (spells-data-loader.jsx) é dono único da seleção E da persistência dela
  // em `spellbook-ui-prefs.selectedVersionKeys` (D-07). index.html não lê nem
  // grava mais nenhum estado de versão.
  // Idioma da interface — estado próprio do App, independente da seleção de
  // pacotes ativa (D-18): a preferência salva em `spellbook-ui-prefs.lang`
  // manda; sem ela, cai pro idioma do navegador.
  const [uiLang, setUiLang] = React.useState(
    initial.lang || detectLang()
  );
  const [showOnboarding, setShowOnboarding] = React.useState(() => !hasSeenOnboarding());
  const [onboardingEditorOpen, setOnboardingEditorOpen] = React.useState(false);

  const { chars } = useCharacters();
  const { w, h } = useViewport();
  // Mobile pela MENOR dimensão: assim um celular usa o layout mobile nas duas
  // orientações (em paisagem a largura passa de 768, mas a altura ~390 não — o
  // layout desktop com zoom deixaria o card maior que a tela). Tablets/desktop,
  // com a menor dimensão >= 768, seguem no layout desktop.
  const isMobile = Math.min(w, h) < 768;

  const character = chars.find(c => c.name === charName) || chars[0];

  // Link de build (?build=) abre em QUALQUER visita — não só no onboarding.
  // Importa direto (abrir o link é a intenção), ativa o personagem, tira o
  // parâmetro da URL (refresh não duplica) e avisa via toast.
  React.useEffect(() => {
    let url;
    try { url = new URL(window.location.href); } catch (e) { return; }
    if (!url.searchParams.has('build')) return;
    try {
      const character = importSharedBuildUrl(window.location.href, uiLang);
      markOnboardingSeen();
      setShowOnboarding(false);
      setCharName(character.name);
      window.dispatchEvent(new CustomEvent('hifi-toast', {
        detail: { msg: makeT(uiLang)('toast.buildImported', { name: character.name }) },
      }));
    } catch (e) {
      window.dispatchEvent(new CustomEvent('hifi-toast', {
        detail: { msg: makeT(uiLang)('toast.buildImportFailed'), kind: 'err' },
      }));
    }
    url.searchParams.delete('build');
    history.replaceState(null, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : ''));
  }, []);

  // Persist prefs whenever they change (tema, modo, personagem, idioma). A
  // seleção de pacotes (Fase 8) é persistida pelo próprio loader em
  // `spellbook-ui-prefs.selectedVersionKeys` — o spread de `prev` (relido a
  // cada execução deste efeito) preserva esse campo intacto, nunca
  // sobrescrito por este write.
  React.useEffect(() => {
    const prev = loadPrefs();
    savePrefs({
      ...prev, dark, theme, characterName: character ? character.name : null, lang: uiLang,
    });
  }, [dark, theme, character, uiLang]);

  // Paint the page background with the active theme so there's no flash of
  // the wrong color around the app (matters on overscroll / safe areas).
  React.useEffect(() => {
    document.body.className =
      `hifi ${dark ? 'hifi-dark' : 'hifi-light'}` +
      (theme && theme !== 'catppuccin' ? ' hifi-theme-' + theme : '');
    // Acompanha o chrome do navegador (mobile) e o color-scheme ao tema ativo.
    try {
      const base = getComputedStyle(document.body).getPropertyValue('--base').trim();
      const tc = document.querySelector('meta[name="theme-color"]');
      if (tc && base) tc.setAttribute('content', base);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  }, [dark, theme]);

  // Reflete o idioma ativo no documento: <html lang> (leitores de tela usam pra
  // escolher a pronúncia) e og:locale (preview de compartilhamento).
  React.useEffect(() => {
    try {
      document.documentElement.setAttribute('lang', uiLang === 'ptbr' ? 'pt-br' : 'en');
      const og = document.querySelector('meta[property="og:locale"]');
      if (og) og.setAttribute('content', uiLang === 'ptbr' ? 'pt_BR' : 'en_US');
    } catch (e) {}
  }, [uiLang]);

  // Wire up the global hooks the V11 components call (dark toggle, character
  // switch after create/edit/delete, share-build link).
  React.useEffect(() => {
    window.__setCharacterByName = (name) => setCharName(name);
    window.__toggleDark = () => setDark(d => !d);
    window.__setDark = (v) => setDark(!!v);
    window.__setTheme = (t) => setTheme(t);
    // Seletor de temas: aplica tema + modo de uma vez.
    window.__setThemePreset = (t, d) => { setTheme(t); setDark(!!d); };
    // Setter global do idioma da interface (D-11), consumido pelo toggle no
    // plano 02. Roteia por normLang (i18n.jsx) pra colapsar qualquer entrada
    // em 'ptbr'/'en' — este bloco roda em escopo global compartilhado.
    window.__setUiLang = (v) => setUiLang(normLang ? normLang(v) : v);
    window.__shareBuild = () => {
      const c = chars.find(x => x.name === (character ? character.name : null)) || chars[0];
      if (!c) return;
      const payload = btoa(unescape(encodeURIComponent(JSON.stringify({
        name: c.name, accentId: c.accentId,
        prepared: c.prepared || [], bookmarked: (typeof loadBookmarks === 'function' ? loadBookmarks() : []),
        slots: c.slots || { total: {}, used: {} },
        classes: c.classes || [],
      }))));
      // encodeURIComponent: base64 tem '+' e '=', que corrompem em query string.
      const url = `${window.location.origin}${window.location.pathname}?build=${encodeURIComponent(payload)}`;
      if (navigator.share) {
        navigator.share({ title: `Grimório · ${c.name}`, url }).catch(() => {});
      } else if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(
          () => window.dispatchEvent(new CustomEvent('hifi-toast', { detail: { msg: 'Link da build copiado' } })),
          () => {},
        );
      }
    };
    return () => {
      window.__setCharacterByName = null;
      window.__toggleDark = null;
      window.__setDark = null;
      window.__setTheme = null;
      window.__setThemePreset = null;
      window.__setUiLang = null;
      window.__shareBuild = null;
    };
  }, [chars, character]);

  // If the active character is deleted, fall back to the first one.
  React.useEffect(() => {
    if (chars.length && !chars.find(c => c.name === charName)) {
      setCharName(chars[0].name);
    }
  }, [chars, charName]);

  // O acento do personagem publicado em :root. Sem isto ele só existe dentro do
  // container de HifiDesktop/HifiMobile, e todo root montado ao lado deles —
  // gerenciador de pacotes, banner de transição, onboarding — cai no fallback
  // `var(--accent, var(--mauve))` (ou, em pack-manager.jsx, num `var(--accent)`
  // sem fallback nenhum). Publicar aqui faz a cor escolhida na ficha valer no
  // app inteiro; os containers que já declaram `--accent` continuam vencendo
  // por especificidade, então nada regride.
  React.useEffect(() => {
    if (!character || typeof window.accentOf !== 'function') return undefined;
    const accent = window.accentOf(character, dark, theme);
    if (!accent) return undefined;
    document.documentElement.style.setProperty('--accent', accent);
    return () => { document.documentElement.style.removeProperty('--accent'); };
  }, [character, dark, theme]);

  if (!character) return null;

  return (
    <>
      {isMobile
        ? <HifiMobile lang={uiLang} dark={dark} theme={theme} character={character} />
        : <HifiDesktop lang={uiLang} dark={dark} theme={theme} character={character} width={w} height={h} />}
      <HifiPrintRoot />
      <PackManagerRoot lang={uiLang} dark={dark} theme={theme} />
      <TransitionBannerRoot lang={uiLang} dark={dark} theme={theme} />
      {showOnboarding && (
        <OnboardingModal
          lang={uiLang}
          dark={dark}
          theme={theme}
          onCreate={() => {
            setShowOnboarding(false);
            setOnboardingEditorOpen(true);
          }}
          onContinue={() => setShowOnboarding(false)}
          onImported={(imported) => {
            setCharName(imported.name);
            setShowOnboarding(false);
          }}
        />
      )}
      {onboardingEditorOpen && (
        <>
          <div className="hifi-onboarding-editor-backdrop" style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(0,0,0,0.35)' }}/>
          <div className="hifi-onboarding-editor-shell" style={{
            position: 'fixed',
            top: isMobile ? 0 : 0,
            right: 0,
            bottom: 0,
            width: isMobile ? '100%' : 460,
            zIndex: 101,
            boxShadow: isMobile ? 'none' : '-8px 0 24px rgba(0,0,0,0.18)',
          }}>
            <CharacterEditor
              lang={uiLang}
              dark={dark}
              theme={theme}
              charId={null}
              mode={isMobile ? 'fullscreen' : 'panel'}
              onClose={(result) => {
                setOnboardingEditorOpen(false);
                if (result?.action === 'created') setCharName(result.character.name);
              }}
            />
          </div>
        </>
      )}
    </>
  );
}

// Um erro de render em qualquer componente desmontaria o app inteiro (tela
// branca, sem explicação). O boundary segura o erro e oferece recarregar.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('[grimorio] render error:', error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="od-boot">
        <div className="od-boot__mark">Grimório</div>
        <div className="od-fallback">
          Algo deu errado ao desenhar a página. / Something went wrong.
          <br/><br/>
          <button
            onClick={() => window.location.reload()}
            style={{ font: 'inherit', padding: '8px 18px', cursor: 'pointer',
              background: '#272822', color: '#f8f7f3', border: 'none', borderRadius: 4 }}
          >Recarregar / Reload</button>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
